<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battery Charging Loader — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  .bc-shell {
  position: relative; width: 110px; height: 54px;
  border-radius: 12px; border: 3px solid #cfd7ea;
  background: #eef1f9; overflow: hidden;
}
.bc-fill {
  position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
  background: linear-gradient(180deg, #7be0a5, #34c48b);
  transition: height .16s linear;               /* 液面平滑上升 */
}
.bc-bolt {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 22px; color: #fff;
  animation: bc-bolt-pulse 1s ease-in-out infinite;
}
@keyframes bc-bolt-pulse { 0%, 100% { transform: scale(1); opacity: .85; }
                           50% { transform: scale(1.22); opacity: 1; } }
</style>
</head>
<body>
<div class="bar"><strong>Battery Charging Loader</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<div class="bc-battery">
  <span class="bc-cap"></span>                 <!-- 电池正极凸起 -->
  <span class="bc-shell">                      <!-- 电池外壳 -->
    <span class="bc-fill"></span>              <!-- 电量液面 -->
    <span class="bc-bolt">⚡</span>            <!-- 闪电图标 -->
  </span>
</div>
<p class="bc-percent">0%</p>
</div>
<script>const fill = document.querySelector('.bc-fill');
const percentEl = document.querySelector('.bc-percent');
const speed = 2;
let pct = 0, timer = null;
function tick() {
  pct = (pct + 1) % 101;                        // 0→100 循环
  fill.style.height = pct + '%';                // 液面与数字同步
  percentEl.textContent = pct + '%';
}
timer = setInterval(tick, 260 / speed);         // speed 为倍率</script>
</body>
</html>
