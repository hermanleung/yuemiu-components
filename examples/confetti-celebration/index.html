<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confetti Celebration — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  
</style>
</head>
<body>
<div class="bar"><strong>Confetti Celebration</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<canvas id="confetti" style="width:100%;height:320px;"></canvas>
<button onclick="fire()">🎉 发射彩带</button>
</div>
<script>const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let W, H, pieces = [], rafId = null;
const PALETTE = ['#ff5f6d', '#ffc145', '#4be3ac', '#6c8cff', '#ff8ecf', '#ffd166', '#a96cff'];

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = canvas.width = r.width * dpr;
  H = canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function spawn(x, y, count, spread) {
  for (let i = 0; i < count; i++) {
    const angle = -Math.PI / 2 + (Math.random() - .5) * (spread * Math.PI / 180);
    const speed = Math.random() * 9 + 5;
    pieces.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 7 + 4,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - .5) * .35,
      color: PALETTE[(Math.random() * PALETTE.length) | 0],
      shape: Math.random() > .5 ? 'rect' : 'circle',
      wobble: Math.random() * Math.PI * 2,
      age: 0,
      maxAge: Math.random() * 160 + 220,
    });
  }
  loop();
}
function fire() { spawn(W / 2, H * .92, 150, 75); }

function loop() {
  if (rafId) return;
  const step = () => {
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.age++;
      p.vy += 0.18;
      p.vx *= 0.985;
      p.x += p.vx + Math.sin(p.age * 0.05 + p.wobble) * 0.8;
      p.y += p.vy;
      p.rot += p.vrot;
      const life = 1 - p.age / p.maxAge;
      if (life <= 0 || (p.y > H + 40 && p.vy > 0)) { pieces.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(life, 0);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66);
      else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    rafId = pieces.length ? requestAnimationFrame(step) : null;
  };
  rafId = requestAnimationFrame(step);
}
resize(); fire();
window.addEventListener('resize', resize);</script>
</body>
</html>
