<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meteor Loader — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  /* 流星：一条渐变光带，头部用伪元素画光晕 */
.ml-meteor {
  position: absolute; width: 120px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,.95),
              rgba(150,190,255,.4) 55%, transparent);
  transform: rotate(-35deg); opacity: 0;
  animation: ml-fly 2.2s ease-in infinite;
}
.ml-meteor::before {
  content: ''; position: absolute; right: -1px; top: 50%;
  width: 6px; height: 6px; margin-top: -3px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 12px 3px rgba(160,200,255,.9);
}
@keyframes ml-fly {
  0%   { transform: translate3d(-60px,-30px,0) rotate(-35deg) scale(.7); opacity: 0; }
  6%   { opacity: 1; }
  22%  { transform: translate3d(420px,240px,0) rotate(-35deg) scale(1); opacity: 1; }
  30%, 100% { transform: translate3d(560px,320px,0) rotate(-35deg); opacity: 0; }
}

/* 星星闪烁 */
.ml-star { position: absolute; border-radius: 50%; background: #fff;
           animation: ml-twinkle 2.6s ease-in-out infinite; }
@keyframes ml-twinkle { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
</style>
</head>
<body>
<div class="bar"><strong>Meteor Loader</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<div class="ml-stage">
  <!-- 星星与流星均由 JS 动态生成 -->
</div>
</div>
<script>const stage = document.querySelector('.ml-stage');
const count = 10, dur = 2.2;
function rand(a, b) { return a + Math.random() * (b - a); }
for (let i = 0; i < count; i++) {
  const m = document.createElement('span');
  m.className = 'ml-meteor';
  m.style.cssText = [
    `top:${rand(4, 50)}%`,                    // 起点纵向位置
    `left:${rand(-10, 45)}%`,                 // 起点横向位置
    `animation-duration:${(dur * rand(0.8, 1.3)).toFixed(2)}s`,
    `animation-delay:${rand(0, 3).toFixed(2)}s`
  ].join(';');
  stage.appendChild(m);
}</script>
</body>
</html>
