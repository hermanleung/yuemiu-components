<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Flip Card Collection — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  .flip-card {
  width: 200px;
  height: 190px;
  perspective: 900px;               /* 视距，3D 翻转的立体感来源 */
}
.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.4, .1, .2, 1);
}
.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;     /* 关键：背面朝外时隐藏 */
  -webkit-backface-visibility: hidden;
  border-radius: 14px;
}
.front { background: #6c8cff; }
.back  { background: #2a2f52; transform: rotateY(180deg); }

/* 触发方式一：悬停 */
.flip-card:hover .flip-inner { transform: rotateY(180deg); }
/* 配合点击模式 */
.flip-card.flipped .flip-inner { transform: rotateY(180deg); }
</style>
</head>
<body>
<div class="bar"><strong>3D Flip Card Collection</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<div class="flip-card">
  <div class="flip-inner">
    <div class="face front">🚀 正面内容</div>
    <div class="face back">翻转后的背面</div>
  </div>
</div>
</div>
<script>// 触发方式二：点击（切换触发方式时使用）
document.querySelectorAll('.flip-card').forEach(card => {
  card.addEventListener('click', () => card.classList.toggle('flipped'));
});</script>
</body>
</html>
