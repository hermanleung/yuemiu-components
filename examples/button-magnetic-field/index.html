<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetic Button — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  .bm-ring {
  position: absolute; width: 220px; height: 220px; border-radius: 50%;
  border: 2px dashed rgba(108,140,255,.5);
  transform: translate(-50%, -50%) scale(.4); opacity: 0;
  transition: transform .5s cubic-bezier(.34,1.2,.64,1), opacity .3s ease;
}
.bm-field.bm-on .bm-ring { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.bm-btn { transition: box-shadow .25s ease; will-change: transform; }
</style>
</head>
<body>
<div class="bar"><strong>Magnetic Button</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<div class="bm-field" id="bmField">
  <div class="bm-ring" id="bmRing"></div>
  <button class="bm-btn bm-primary"><span class="bm-text">磁场按钮</span></button>
  <button class="bm-btn bm-outline"><span class="bm-text">描边磁场</span></button>
  <button class="bm-btn bm-dark"><span class="bm-text">深色磁场</span></button>
</div>
</div>
<script>const field = document.getElementById('bmField');
const ring = document.getElementById('bmRing');
const buttons = [...field.querySelectorAll('.bm-btn')];
const textEls = buttons.map((b) => b.querySelector('.bm-text'));
const state = buttons.map(() => ({ tx: 0, ty: 0, cx: 0, cy: 0 }));
let raf = null;

function tick() {
  let settled = true;
  buttons.forEach((btn, i) => {
    const s = state[i];
    s.cx += (s.tx - s.cx) * 0.18;                 // 每帧向目标逼近 18%
    s.cy += (s.ty - s.cy) * 0.18;
    if (Math.abs(s.tx - s.cx) > 0.1 || Math.abs(s.ty - s.cy) > 0.1) settled = false;
    btn.style.transform = `translate(${s.cx.toFixed(2)}px, ${s.cy.toFixed(2)}px)`;
    textEls[i].style.transform = `translate(${(s.cx * 0.35).toFixed(2)}px, ${(s.cy * 0.35).toFixed(2)}px)`;
  });
  raf = settled ? null : requestAnimationFrame(tick);   // 稳定后自动停帧省电
}

function onMove(e) {
  ring.style.left = e.clientX - field.getBoundingClientRect().left + 'px';
  ring.style.top = e.clientY - field.getBoundingClientRect().top + 'px';
  buttons.forEach((btn, i) => {
    const rect = btn.getBoundingClientRect();
    const dx = e.clientX - (rect.left + rect.width / 2);
    const dy = e.clientY - (rect.top + rect.height / 2);
    const dist = Math.hypot(dx, dy);
    const pull = Math.max(0, 1 - dist / 220) * 0.5;   // 距离越近吸力越强
    state[i].tx = dx * pull;
    state[i].ty = dy * pull;
  });
  if (!raf) raf = requestAnimationFrame(tick);
}
field.addEventListener('pointermove', onMove);
field.addEventListener('pointerleave', () => {
  state.forEach((s) => { s.tx = 0; s.ty = 0; });      // 归零目标，自然回弹
  if (!raf) raf = requestAnimationFrame(tick);
});</script>
</body>
</html>
