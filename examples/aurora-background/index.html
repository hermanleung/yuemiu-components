<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Background — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  .aurora-bg {
  position: relative; width: 100%; height: 340px; overflow: hidden;
  background: radial-gradient(120% 130% at 50% 0%, #0c1330 0%, #05060f 62%);
  --dur: 14s; /* 动画基准时长，JS 可动态修改 */
}
.aurora {
  position: absolute; border-radius: 50%;
  filter: blur(72px); mix-blend-mode: screen;
  opacity: .7; will-change: transform;
}
.a1 { width: 70%; height: 90%; left: -20%; top: -30%;
  background: radial-gradient(circle at 35% 40%, #4f6ef7 0%, transparent 60%);
  animation: drift1 var(--dur) ease-in-out infinite alternate; }
.a2 { width: 60%; height: 80%; right: -15%; top: -10%;
  background: radial-gradient(circle at 60% 40%, #22d3ee 0%, transparent 60%);
  animation: drift2 calc(var(--dur) * 1.4) ease-in-out infinite alternate; }
.a3 { width: 75%; height: 85%; left: 8%; bottom: -42%;
  background: radial-gradient(circle at 50% 40%, #a855f7 0%, transparent 62%);
  animation: drift3 calc(var(--dur) * 1.15) ease-in-out infinite alternate; }
.a4 { width: 55%; height: 70%; right: 4%; bottom: -28%;
  background: radial-gradient(circle at 50% 50%, #f472b6 0%, transparent 60%);
  animation: drift4 calc(var(--dur) * 1.7) ease-in-out infinite alternate; }
.a5 { width: 45%; height: 60%; left: 30%; top: 18%;
  background: radial-gradient(circle at 50% 50%, #34d399 0%, transparent 60%);
  animation: drift2 calc(var(--dur) * 2.1) ease-in-out infinite alternate-reverse; }

@keyframes drift1 { from { transform: translate(0,0) scale(1) rotate(0deg); } to { transform: translate(16%,12%) scale(1.3) rotate(22deg); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-20%,16%) scale(.9) rotate(-16deg); } }
@keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(12%,-18%) scale(1.35); } }
@keyframes drift4 { from { transform: translate(0,0) scale(1.15); } to { transform: translate(-16%,-12%) scale(.95) rotate(26deg); } }
</style>
</head>
<body>
<div class="bar"><strong>Aurora Background</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<div class="aurora-bg">
  <i class="aurora a1"></i>
  <i class="aurora a2"></i>
  <i class="aurora a3"></i>
  <i class="aurora a4"></i>
  <i class="aurora a5"></i>
  <p class="aurora-tip">极光背景 · 纯 CSS 实现</p>
</div>
</div>
<script>// 控制：速度/色相/强度（演示面板同款逻辑）
const wrap = document.querySelector('.aurora-bg');
const speedEl = document.querySelector('#auSpeed');   // 0-200，默认 100
const hueEl = document.querySelector('#auHue');       // 0-360
const alphaEl = document.querySelector('#auAlpha');   // 20-100
if (speedEl) speedEl.addEventListener('input', e => {
  const v = +e.target.value;
  wrap.style.setProperty('--dur', `${(26 - v / 100 * 23).toFixed(1)}s`);
});
if (hueEl) hueEl.addEventListener('input', e => wrap.style.filter = `hue-rotate(${e.target.value}deg)`);
if (alphaEl) alphaEl.addEventListener('input', e => wrap.style.setProperty('--alpha', e.target.value / 100));</script>
</body>
</html>
