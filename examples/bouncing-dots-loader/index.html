<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouncing Dots Loader — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  .bd-dots {
  --bd-dur: 1s;            /* 一个完整弹跳周期 */
  --bd-color: #6c8cff;     /* 圆点主色 */
  display: flex; gap: 10px;
}
.bd-dots i {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--bd-color);
  animation: bd-bounce var(--bd-dur) ease-in-out infinite;
}
/* 每个点错开 0.1 个周期，形成波浪 */
.bd-dots i:nth-child(1) { animation-delay: calc(var(--bd-dur) * -0.4); }
.bd-dots i:nth-child(2) { animation-delay: calc(var(--bd-dur) * -0.3); }
.bd-dots i:nth-child(3) { animation-delay: calc(var(--bd-dur) * -0.2); }
.bd-dots i:nth-child(4) { animation-delay: calc(var(--bd-dur) * -0.1); }

@keyframes bd-bounce {
  0%, 60%, 100% { transform: translateY(0) scale(1); opacity: .45; }
  30%           { transform: translateY(-26px) scale(1.12); opacity: 1; }
}
</style>
</head>
<body>
<div class="bar"><strong>Bouncing Dots Loader</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<div class="bd-dots">
  <i></i><i></i><i></i><i></i><i></i>
</div>
</div>
<script>const stage = document.querySelector('.bd-dots');
const dots = document.querySelector('.bd-dots');
const speed = 1;
const paused = false;
// 速度：周期 = 基准 / 倍率
stage.style.setProperty('--bd-dur', (1 / speed).toFixed(2) + 's');
// 暂停：给容器加类，统一冻结所有圆点
dots.classList.toggle('paused', paused); // .paused i { animation-play-state: paused }</script>
</body>
</html>
