<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradient Text Effects — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  .g-txt {
  font-size: 34px;
  font-weight: 800;
  background: linear-gradient(90deg, #6c8cff, #b388ff);
  -webkit-background-clip: text;   /* 把背景裁剪成文字形状 */
  background-clip: text;
  -webkit-text-fill-color: transparent;  /* 文字本身透明，露出背景 */
  color: transparent;              /* 标准写法兜底 */
}

/* 彩虹流动：背景放大 300% 并循环移动 */
.g-rainbow {
  background: linear-gradient(90deg, #ff6b6b, #ffa94d, #ffe066, #51cf66, #339af0, #b388ff, #ff6b6b);
  background-size: 300% 100%;
  animation: gradmove 4s linear infinite;
}
@keyframes gradmove { to { background-position: 300% 0; } }

/* 双色对比：用 50% 色标一分为二 */
.g-split {
  background: linear-gradient(90deg, #43e97b 0%, #38f9d7 50%, #6c8cff 50%, #b388ff 100%);
}
</style>
</head>
<body>
<div class="bar"><strong>Gradient Text Effects</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<p class="g-txt g-linear">01 · 经典线性渐变</p>
<p class="g-txt g-rainbow">02 · 彩虹流动渐变</p>
<p class="g-txt g-split">03 · 双色对比渐变</p>
<p class="g-txt g-glass">04 · 玻璃质感渐变</p>
<p class="g-txt g-fire">05 · 火焰熔岩渐变</p>
</div>

</body>
</html>
