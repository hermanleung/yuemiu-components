<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typewriter Text Effect — yuemiu 开源示例</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1117;color:#e6e6e6;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#1a1d27;border-bottom:1px solid #2a2e3d;font-size:13px}
  .bar a{color:#6c8cff;text-decoration:none}
  .demo-wrap{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh}
  .demo-wrap > * {max-width:100%}
  .typewriter {
  display: inline-block;
  overflow: hidden;
  white-space: nowrap;
  border-right: 2px solid #6c8cff;   /* 光标 */
  width: 0;
  animation:
    typing 4s steps(24, end) forwards,  /* 打字时长=字符数×0.15s左右 */
    caret .7s step-end infinite;         /* 光标闪烁 */
}
@keyframes typing { to { width: 24em; } }
@keyframes caret { 50% { border-color: transparent; } }
</style>
</head>
<body>
<div class="bar"><strong>Typewriter Text Effect</strong><a href="https://yuemiu.cn/" target="_blank" rel="noopener">更多组件 → yuemiu.cn 粤喵组件库</a></div>
<div class="demo-wrap">
<p class="typewriter">你好，我是粤喵 🎨</p>
<p id="typewriter" data-text="JavaScript 版打字机，逐字敲出！"></p>
</div>
<script>const el = document.getElementById('typewriter');
const full = el.dataset.text;
let i = 0, deleting = false;
function tick() {
  el.textContent = full.slice(0, i);
  if (!deleting) {
    if (i < full.length) { i++; setTimeout(tick, 90); }        // 打字速度
    else { deleting = true; setTimeout(tick, 1600); }           // 停留时间
  } else {
    if (i > 0) { i--; setTimeout(tick, 40); }                   // 删除速度
    else { deleting = false; setTimeout(tick, 400); }           // 重新开始前停顿
  }
}
tick();</script>
</body>
</html>
